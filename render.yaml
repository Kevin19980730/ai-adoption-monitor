services:
  - type: web
    name: ai-adoption-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir btos-ai --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: AAM_HOSTED
        value: "1"
